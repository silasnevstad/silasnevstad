name: Update profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: profile-assets-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Ensure output dir
        run: mkdir -p profile

      - name: Generate stats card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&rank_icon=github&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate top languages card
        continue-on-error: true
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&count_private=true&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate isocalendar (half-year)
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          filename: profile/isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Python deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check matplotlib requests

      - name: Generate 26w activity chart (account-wide)
        continue-on-error: true
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          OUT_PATH: profile/activity-26w.svg
        run: |
          python scripts/gen_activity_chart.py
